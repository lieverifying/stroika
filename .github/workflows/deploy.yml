# Выкладка сайта на хостинг adm.tools (фаза 9).
# push в main или запуск вручную → тесты (юнит, PHP, e2e) → сборка → загрузка по SSH (rsync) → проверка живого сайта.
# Сборка: SITE_ENV из переменной репозитория SITE_ENV (по умолчанию staging — с noindex). Боевая (production) включается
# переменной SITE_ENV=production, когда в facts.ts не останется заглушек: scripts/check-release.mjs не пропустит иначе.
# Секреты (Settings → Secrets → Actions): DEPLOY_SSH_KEY — приватный ключ для выкладки, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID;
# необязательно GAS_URL, GAS_SECRET, LEAD_EMAIL_TO, LEAD_EMAIL_FROM. В логах их нет: GitHub маскирует значения.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: xk589064.ftp.tools
  DEPLOY_USER: xk589064
  # Каталог сайта в домашней папке аккаунта: внутри www — сайт, рядом config/ — секреты заявок (вне публичной папки)
  DEPLOY_SITE_DIR: prime-studio.space
  SITE_URL: ${{ vars.SITE_URL || 'https://prime-studio.space' }}
  SITE_ENV: ${{ vars.SITE_ENV || 'staging' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Юнит-тесты
        run: npx vitest run
      - name: Тесты приёма заявок (PHP)
        run: npm run test:php
      - name: Браузеры для e2e
        run: npx playwright install --with-deps chromium
      - name: E2E (375 и 1280 px)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.SITE_ENV || 'staging' }}
      url: ${{ vars.SITE_URL || 'https://prime-studio.space' }}
    steps:
      - name: Секреты для выкладки на месте
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::Нет секрета DEPLOY_SSH_KEY (приватный ключ выкладки)"; exit 1; fi
          if [ -z "$TG_TOKEN" ]; then echo "::error::Нет секрета TELEGRAM_BOT_TOKEN — заявки не будут уходить"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка (${{ env.SITE_ENV }})
        run: npm run build

      - name: Каталог выкладки — сайт и приёмник заявок
        run: |
          mkdir -p deploy
          cp -a dist/. deploy/
          mkdir -p deploy/api
          cp api/lead.php api/lead-lib.php api/.htaccess deploy/api/

      - name: Конфиг заявок из секретов (кладётся вне www)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_SECRET: ${{ secrets.GAS_SECRET }}
          LEAD_EMAIL_TO: ${{ secrets.LEAD_EMAIL_TO }}
          LEAD_EMAIL_FROM: ${{ secrets.LEAD_EMAIL_FROM }}
        run: |
          umask 077
          mkdir -p private
          php -r '
            $site = rtrim(getenv("SITE_URL"), "/");
            $host = parse_url($site, PHP_URL_HOST);
            $cfg = [
              "site_url" => $site,
              "allowed_origins" => ["https://www.$host", "http://$host", "http://www.$host"],
              "telegram_bot_token" => getenv("TG_TOKEN") ?: "",
              "telegram_chat_id" => getenv("TG_CHAT") ?: "",
              "gas_url" => getenv("GAS_URL") ?: "",
              "gas_secret" => getenv("GAS_SECRET") ?: "",
              "lead_email_to" => getenv("LEAD_EMAIL_TO") ?: "",
              "lead_email_from" => getenv("LEAD_EMAIL_FROM") ?: "",
              "rate_limit" => 5,
              "rate_window_sec" => 600,
            ];
            if ($cfg["telegram_bot_token"] === "" && $cfg["lead_email_to"] === "" && $cfg["gas_url"] === "") {
              fwrite(STDERR, "Нет ни одного канала заявок: внесите TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID в секреты\n");
              exit(1);
            }
            file_put_contents("private/lead.php", "<?php\n// Создано выкладкой из GitHub Secrets. Не редактировать на сервере — перезапишется.\nreturn " . var_export($cfg, true) . ";\n");
          '
          php -l private/lead.php

      - name: SSH-ключ
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ключи сервера закреплены: подмена хоста остановит выкладку
          cat >> ~/.ssh/known_hosts <<'KNOWN'
          xk589064.ftp.tools ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILYIz/av0LW+J36t7lCPNuwKRRIK1PdC1zhmR5qWPDPm
          xk589064.ftp.tools ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBApcbMhssclNR5v7PV+2W/uzLTNZdIfJoO3UCxIkELZ+po8Rd8KTpV1uQ+EfUMM9zgJqeQ1/x7D+lFHTeOiLCYs=
          KNOWN
          sed -i 's/^ *//' ~/.ssh/known_hosts

      - name: Загрузка на хостинг
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          $SSH "$TARGET" "mkdir -p ~/$DEPLOY_SITE_DIR/www ~/$DEPLOY_SITE_DIR/config/data && chmod 700 ~/$DEPLOY_SITE_DIR/config ~/$DEPLOY_SITE_DIR/config/data"
          # Конфиг — первым: новый lead.php не должен увидеть сайт без конфига
          rsync -a --chmod=F600 -e "$SSH" private/lead.php "$TARGET:$DEPLOY_SITE_DIR/config/lead.php"
          # Сайт: точная копия каталога выкладки, устаревшие файлы удаляются (только внутри www)
          rsync -az --delete --delay-updates -e "$SSH" deploy/ "$TARGET:$DEPLOY_SITE_DIR/www/"

      - name: Проверка живого сайта
        run: |
          set -e
          base="${SITE_URL%/}"
          for p in / /kukhni /mebli /roboty /kontakty /yak-my-stvoriuiemo /dyakuyemo /polityka; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p")
            echo "$p → $code"
            test "$code" = 200
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/takoi-storinky-nemaie")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/lead.php")" = 405
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/lead-lib.php")" = 403
          # приёмник видит конфиг: на пустую заявку отвечает 422 (неверные поля), а не 500 (нет конфига)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"elapsedMs":9000}' "$base/api/lead.php")
          echo "api POST → $code"
          test "$code" = 422

      - name: Удалить ключ и конфиг с раннера
        if: always()
        run: rm -f ~/.ssh/deploy_key private/lead.php
