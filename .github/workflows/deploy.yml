# Выкладка на Namecheap Shared Hosting (cPanel, LiteSpeed) — https://vymir.site (фаза 9, переезд 2026-10-22).
# push в main или запуск вручную → тесты (юнит, PHP, e2e) → боевая сборка → загрузка по FTPS (явный TLS, порт 21)
# в public_html → проверка живого сайта.
#
# Секреты (Settings → Secrets and variables → Actions → Secrets), вносит владелец:
#   FTP_SERVER    — адрес FTP-сервера (premium25.web-hosting.com)
#   FTP_USERNAME  — deploy@vymir.site (доступ только к /home/vymimufd/public_html)
#   FTP_PASSWORD  — пароль этого FTP-аккаунта
# Переменные (Settings → Secrets and variables → Actions → Variables), необязательные — без них тег не выводится:
#   PUBLIC_GA4_ID, PUBLIC_GADS_ID, PUBLIC_GADS_LEAD, PUBLIC_META_PIXEL_ID, PUBLIC_GSC_VERIFICATION; SITE_URL и SITE_ENV — если нужно переопределить.
# Секреты заявок (токен бота, ID чата) в GitHub не нужны: они в /home/vymimufd/vymir-config/lead.php, его создаёт
# владелец в cPanel. Сюда не попадают ни значения секретов, ни их вывод: GitHub маскирует их в логах.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://vymir.site' }}
  SITE_ENV: ${{ vars.SITE_ENV || 'production' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # тесты — на тестовой сборке (noindex, без тегов аналитики)
      SITE_ENV: development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Юнит-тесты
        run: npx vitest run
      - name: Тесты приёма заявок (PHP)
        run: npm run test:php
      - name: Браузеры для e2e
        run: npx playwright install --with-deps chromium
      - name: E2E (375 и 1280 px)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: ${{ (vars.SITE_ENV || 'production') == 'production' && 'production' || 'staging' }}
      url: ${{ vars.SITE_URL || 'https://vymir.site' }}
    steps:
      - name: Секреты для выкладки на месте
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Нет секрета $v"; exit 1; fi
          done
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Боевая сборка падает на заглушках {{…}} (scripts/check-release.mjs) — тогда выкладки не будет
      - name: Сборка (${{ env.SITE_ENV }})
        env:
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_GADS_ID: ${{ vars.PUBLIC_GADS_ID }}
          PUBLIC_GADS_LEAD: ${{ vars.PUBLIC_GADS_LEAD }}
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
          PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
        run: npm run build

      - name: Каталог выкладки — сайт и приёмник заявок
        run: |
          mkdir -p deploy/api
          cp -a dist/. deploy/
          cp api/lead.php api/lead-lib.php api/.htaccess deploy/api/

      # Синхронизация: загружаются изменённые файлы, удаляются только те, что выложила эта же выкладка
      # (состояние — .ftp-deploy-sync-state.json в public_html; .well-known и чужие файлы не трогаются)
      - name: Загрузка по FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**

      - name: Проверка живого сайта
        run: |
          set -e
          base="${SITE_URL%/}"
          for p in / /kukhni /mebli /roboty /kontakty /yak-my-stvoriuiemo /dyakuyemo /polityka /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p")
            echo "$p → $code"
            test "$code" = 200
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/takoi-storinky-nemaie")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/lead.php")" = 405
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/lead-lib.php")" = 403
          # приёмник видит конфиг в vymir-config: на пустую заявку — 422 (неверные поля), а не 500 (нет конфига)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"elapsedMs":9000}' "$base/api/lead.php")
          echo "api POST → $code"
          if [ "$code" = 500 ]; then echo "::error::Нет /home/vymimufd/vymir-config/lead.php — заявки не уходят"; exit 1; fi
          test "$code" = 422
